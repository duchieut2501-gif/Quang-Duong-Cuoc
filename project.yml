name: QuangDuongCuoc
options:
  bundleIdPrefix: com.quangduongcuoc
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  QuangDuongCuoc:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Overlay
        excludes: ["libs/**"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quãng Đường
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Chọn ảnh chụp màn hình báo cuốc để thử.
        NSLocationWhenInUseUsageDescription: Dùng vị trí xe để tìm đúng điểm đón.
        NSLocationAlwaysAndWhenInUseUsageDescription: Dùng vị trí xe để tìm đúng điểm đón khi đang chạy nền.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quangduongcuoc.app
        SWIFT_OBJC_BRIDGING_HEADER: Overlay/Bridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Overlay/headers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: $(SRCROOT)/Overlay/libs/GraphicsServices.tbd $(SRCROOT)/Overlay/libs/BackBoardServices.tbd $(SRCROOT)/Overlay/libs/SpringBoardServices.tbd
    dependencies:
      - target: CuocBroadcast
  CuocBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Quãng Đường
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        NSLocationWhenInUseUsageDescription: Dùng vị trí xe để tìm đúng điểm đón.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quangduongcuoc.app.broadcast
